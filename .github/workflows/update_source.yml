name: Update JESSI Source
run-name: Update JESSI Source
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  test-command:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      
      # builds from the template in the repo, so it works even before the source release exists
      - name: Make all source modifications
        run: |
          set -euo pipefail
          version=$(grep -m1 'MARKETING_VERSION =' JESSI.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = \(.*\);/\1/')
          ipa_url="https://github.com/${{ github.repository }}/releases/latest/download/JESSI.ipa"
          size=$(curl -fsSL "$ipa_url" | wc -c)
          jq --arg version "$version" --arg date "$(date -I)" --arg url "$ipa_url" --argjson size "$size" \
            '.apps[].versions[] |= (.version = $version | .date = $date | .size = $size | .downloadURL = $url)' \
            .github/source-template.json > source.json
          cat source.json

      - name: Update source release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: "source.json"
          artifactContentType: JSON
          tag: "source"
